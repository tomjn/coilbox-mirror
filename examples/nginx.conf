# A Coilbox mirror on nginx with PHP-FPM. nginx ignores the .htaccess files, so this site repeats their rules.
# Install it as /etc/nginx/sites-available/mirror.example.org and link it into sites-enabled.
#
# Change these to match your server:
# - server_name, in both server blocks
# - root, the web folder that holds upload.php
# - the two ssl_certificate paths
# - fastcgi_pass, the PHP-FPM socket of PHP 8.4 or later
#
# The listing header needs the sub and ssi modules. The nginx.org packages and Debian and Ubuntu's nginx have both.

server {
    listen 80;
    listen [::]:80;
    server_name mirror.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mirror.example.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mirror.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirror.example.org/privkey.pem;

    root /var/www/mirror.example.org;
    charset utf-8;

    # Must be at least PHP's post_max_size, or nginx refuses upload chunks that PHP would accept.
    # 8m matches PHP's default post_max_size. Raise both together.
    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Everything not named below is refused. That covers private/, src/, bin/, .partial/, sync.php and dotfiles.
    location / {
        deny all;
    }

    # The two PHP entry points. No other PHP file runs.
    location ~ ^/(upload|limits)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # Files the mirror writes for peers and the hub.
    location = /listing.json {
    }

    location = /catalogue.json {
    }

    location = /catalogue.sig {
        types { }
        default_type text/plain;
    }

    # The listing style and header.
    location = /listing.css {
    }

    location = /listing-header.html {
    }

    # The archives. nginx lists each folder, which is how people find files.
    location ~ ^/(maps|games)(/|$) {
        # Covers .htaccess. The listing already leaves dotfiles out.
        location ~ /\. {
            deny all;
        }

        # Every archive downloads rather than renders.
        types { }
        default_type application/octet-stream;

        autoindex on;

        # Adds the style and the header to the listing page, the way the .htaccess files do on Apache.
        # The listing page is the only HTML here, so archives pass through unchanged.
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/listing.css"><meta name="viewport" content="width=device-width, initial-scale=1"></head>';
        sub_filter '<body>' '<body><!--# include virtual="/listing-header.html" -->';
        ssi on;
    }
}
